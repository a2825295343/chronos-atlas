<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球时序数据核查 · 观澜</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",sans-serif;background:#132024;color:#dce4db}*{box-sizing:border-box}body{margin:0}main{max-width:1250px;margin:auto;padding:40px 32px 70px}a{color:#e3c77e}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #405052;padding-bottom:24px}.brand{font:28px Georgia,serif;letter-spacing:5px}.eyebrow{color:#acbbaa;letter-spacing:3px;font-size:11px}h1{font:34px "Noto Serif SC","SimSun",serif;margin:30px 0 14px}p{line-height:1.9;color:#b7c5bd}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.card{background:#1e3034;border:1px solid #415153;padding:20px;border-radius:6px}.card strong{display:block;color:#e5ca8c;font:30px Georgia,serif;margin-bottom:8px}.card span{font-size:12px;color:#b2c0b7}.note{border-left:3px solid #bf9860;background:#273333;padding:15px 20px;margin:20px 0;color:#d4cbb0;line-height:1.8}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 14px}button,input{font:inherit;color:inherit;background:#213236;border:1px solid #4b5b5a;border-radius:4px;padding:10px 15px}button{cursor:pointer}button.active{color:#16262a;background:#ddc183;border-color:#ddc183}input{flex:1;min-width:200px}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#d7c28d;font-weight:normal;padding:14px 12px;background:#203236;position:sticky;top:0}td{padding:15px 12px;border-bottom:1px solid #33474b;line-height:1.7;vertical-align:top}td:first-child{min-width:155px}td small{display:block;color:#8fa59d}#count{color:#a3b7ac;font-size:12px;margin:15px 0}.table-wrap{overflow:auto}footer{margin-top:36px;color:#93aaa1;font-size:12px;line-height:1.8}@media(max-width:700px){main{padding:22px 18px}.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:27px}}
</style><main><header><span class="brand">观澜 <span class="eyebrow">CHRONOS · DATA REVIEW</span></span><a href="/">返回地图 ↗</a></header><h1>全球时序数据核查</h1><p id="scope">正在读取检查结果…</p><div id="cards" class="cards"></div><div class="note">逐年查询会按所选年份筛选有效记录；有史料支持的事件年份切换版图。缺少新轮廓的年份继续使用标明适用期的概化边界。下方“待复核”是线索清单，不能解释为已确认错误，也不能解释为已经修复。</div><div class="tools" id="tabs"><button data-tab="corrections" class="active">已确认修正</button><button data-tab="metadata">年代待复核</button><button data-tab="spatial">空间重叠线索</button><button data-tab="long">长期沿用轮廓</button><input id="search" type="search" placeholder="筛选国家、地区或问题…" aria-label="筛选核查记录"></div><div id="count"></div><div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div><footer><p id="limits"></p><a href="/data/chronology-audit.json">完整机器可读检查报告</a> · <a href="/data/chronology-corrections.json">修正清单与原始出处</a> · <a href="https://github.com/Seshat-Global-History-Databank/cliopatria" target="_blank" rel="noreferrer">Cliopatria 数据说明</a></footer></main>
<script type="module">
let data,tab='corrections';const $=id=>document.getElementById(id),el=(tag,text)=>{const x=document.createElement(tag);x.textContent=text;return x};
function render(){if(!data)return;const q=$('search').value.toLowerCase();let headers,rows;
if(tab==='corrections'){headers=['原始政权／地区','适用年代','修正内容','核对依据'];rows=data.corrections.map(r=>[r.name,`${r.from}—${r.to}`,r.reason,{text:r.label+' · '+r.qid,url:r.qid.startsWith('Q')?'https://www.wikidata.org/wiki/'+r.qid:'https://en.wikipedia.org/wiki/'+encodeURIComponent(r.article)}]);}
if(tab==='metadata'){headers=['原始政权／地区','地图记录范围','关联条目年代','待复核原因'];rows=data.metadataReviewQueue.map(r=>[{text:r.label+' / '+r.name,url:r.source},`${r.from}—${r.to}`,`关联：${r.entityLabel} / ${r.entityEnglish}；建国：${r.founded.join('、')||'未记录'}；结束：${r.dissolved.join('、')||'未记录'}`,r.reasons.join('；')]);}
if(tab==='spatial'){headers=['重叠政权','检出年份','较小地块最大重叠率','核查说明'];rows=data.spatialReviewQueue.map(r=>[r.countries.join(' / '),r.checkpoints.join('、'),Math.round(r.maximumSmallerAreaShare*100)+'%',r.status]);}
if(tab==='long'){headers=['政权／地区','记录适用期','沿用年数','轮廓精度'];rows=data.longIntervals.map(r=>[r.name,`${r.from}—${r.to}`,r.years,r.accuracy]);}
rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));$('count').textContent=`共 ${rows.length.toLocaleString('zh-CN')} 条；${tab==='corrections'?'这里的实体修正不代表相应全部疆界已经重绘。':'线索保留原名；未以猜测覆盖源数据。'}`;$('head').replaceChildren(...headers.map(h=>el('th',h)));$('rows').replaceChildren(...rows.slice(0,500).map(r=>{const tr=document.createElement('tr');for(const v of r){const td=document.createElement('td');if(v&&typeof v==='object'){const a=el('a',v.text);a.href=v.url;a.target='_blank';a.rel='noreferrer';td.append(a);}else td.textContent=v;tr.append(td);}return tr}));if(rows.length>500)$('count').textContent+=' 当前列出前500条，可输入名称筛选。';}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;for(const btn of $('tabs').querySelectorAll('button'))btn.classList.toggle('active',btn===b);render()});$('search').addEventListener('input',render);
fetch('/data/chronology-audit.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;const s=d.summary;$('scope').textContent=d.scope;$('cards').replaceChildren(...[[s.uniqueDatedRows,'全球有效期记录'],[s.yearQueriesChecked,'逐年有效期检查'],[s.reviewedCorrectionRules,'已确认的身份与年代规则'],[s.metadataLeadsRemaining,'仍待史料核定的年代线索']].map(([v,label])=>{const c=el('div','');c.className='card';c.append(el('strong',v.toLocaleString('zh-CN')),el('span',label));return c}));$('limits').textContent=d.limitations.join(' ');render()}).catch(()=>{$('scope').textContent='检查报告读取失败，请刷新或重新运行数据核查脚本。'});
</script></html>
